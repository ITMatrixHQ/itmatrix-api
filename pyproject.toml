#Package name will not be project root, will be the primary python package dir.
#Lets also say we support down to python 3.10 even if that isn't tested.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhq"
version = "0.0.1"
description = "Python client for the MHQ public API."
authors = [{name = "Charles Marks", email = "charlesmarksco@gmail.com"}]
readme = "api.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "aiohttp>=3.9",
  "msgspec>=0.18",
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
win = ["winloop>=0.1; platform_system == 'Windows'"]
linux = ["uvloop>=0.19; platform_system == 'Linux'"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-timeout>=2"]

[tool.hatch.build.targets.wheel]
packages = ["mhq"]

[tool.hatch.build.targets.sdist]
include = ["api.md", "LICENSE", "mhq"]

[tool.coverage.run]
branch = true
core = "ctrace"

[tool.coverage.report]
exclude_also = [
  "if __debug__",
  'if self\.debug',
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  '@(abc\.)?abstractmethod',
]
ignore_errors = true

[tool.coverage.html]
directory = "tests/report/coverage"
show_contexts = true

[tool.pytest.ini_options]
markers = ["regression: Tests that failed in old versions."]
xfail_strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E4", "E5", "E7", "E9", "F", "B", "Q", "FA"]
ignore = ["E701","E731", "Q000", "Q001","PLR09"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
# float-to-top = true

[tool.ruff.analyze]
detect-string-imports = true

# conda env seems broken for pyrefly rn
# python-interpreter-path = "your/path"
# conda-environment = "your_conda_env"
[tool.pyrefly.errors]
untyped-import = false
