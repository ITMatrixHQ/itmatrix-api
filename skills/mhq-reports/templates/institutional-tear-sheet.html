<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Institutional Tear Sheet Template</title>
  <style>
    :root {
      --bg: #f5eddc;
      --surface: #fff9ec;
      --ink: #131f35;
      --muted: #6f6a5f;
      --line: #c7b58f;
      --accent: #173f7a;
      --positive: #176b45;
      --negative: #8d1f2d;
      --pivot: #b98222;
      --display: Georgia, "Times New Roman", serif;
      --body: "Segoe UI", Aptos, sans-serif;
      --mono: "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 500 16px/1.5 var(--body); }
    .sheet { width: min(1280px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
    .rule { height: 9px; background: linear-gradient(90deg, var(--accent) 45%, var(--pivot) 45% 62%, var(--negative) 62%); }
    .header { display: grid; grid-template-columns: 1fr 260px; gap: 20px; padding: 28px 0; border-bottom: 2px solid var(--ink); }
    h1 { max-width: 820px; margin: 0; font: 900 clamp(3rem, 7vw, 7rem)/.86 var(--display); letter-spacing: -.06em; }
    .stamp { border: 2px solid var(--ink); padding: 16px; background: var(--surface); font-family: var(--mono); text-transform: uppercase; }
    .stamp strong { display: block; margin-top: 8px; color: var(--accent); font-size: 2rem; }
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 22px; margin-top: 22px; }
    .section { border-top: 2px solid var(--ink); padding-top: 14px; }
    h2 { margin: 0 0 12px; font: 900 .86rem var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    .metric-line { display: grid; grid-template-columns: 170px 1fr 110px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .metric-line strong { font: 900 1.35rem var(--display); }
    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .thesis { min-height: 430px; padding: 22px; background: var(--surface); border: 2px solid var(--ink); }
    .thesis p { font: 600 clamp(1.15rem, 2vw, 1.6rem)/1.4 var(--display); }
    table { width: 100%; border-collapse: collapse; background: rgba(255, 249, 236, .62); }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--accent); font: 900 .74rem var(--mono); text-transform: uppercase; }
    @media (max-width: 900px) { .header, .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="rule"></div>
    <header class="header">
      <div>
        <p>58% common / familiar but elevated</p>
        <h1>Weekly Market Structure Tear Sheet</h1>
      </div>
      <aside class="stamp">Primary symbol<strong>{{SYMBOL}}</strong></aside>
    </header>
    <section class="grid">
      <article class="thesis">
        <h2>Investment Desk Read</h2>
        <p>{{THESIS_COPY}}</p>
      </article>
      <aside class="section">
        <h2>Level Summary</h2>
        <div class="metric-line"><span>Control</span><strong>{{PIVOT}}</strong><span class="positive">{{NET_GEX}}</span></div>
        <div class="metric-line"><span>Upside shelf</span><strong>{{RESISTANCE}}</strong><span>resistance</span></div>
        <div class="metric-line"><span>Downside shelf</span><strong>{{SUPPORT}}</strong><span class="negative">support</span></div>
      </aside>
    </section>
  </main>
</body>
</html>
