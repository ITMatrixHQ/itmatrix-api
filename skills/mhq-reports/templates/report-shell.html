<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #05070a;
      --surface: #0b1117;
      --surface-2: #101a23;
      --text: #f5fbff;
      --muted: #91a4b2;
      --line: #263846;
      --positive: #36f263;
      --negative: #ff4157;
      --warning: #ffd52e;
      --accent: #1398ff;
      --font-display: "Rajdhani", "Arial Narrow", sans-serif;
      --font-body: "Barlow Condensed", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 30rem),
        linear-gradient(145deg, var(--bg), #000);
      color: var(--text);
      font: 500 17px/1.45 var(--font-body);
    }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .panel {
      grid-column: span 4;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--surface) 94%, white), var(--surface));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .42);
      padding: 18px;
    }

    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: 1 / -1; }

    h1, h2, h3 { font-family: var(--font-display); text-transform: uppercase; }
    h1 { font-size: clamp(2.6rem, 6vw, 5.4rem); line-height: .88; margin: 0 0 12px; }
    h2 { margin: 0 0 12px; color: var(--accent); letter-spacing: .08em; }
    p { color: var(--muted); }

    @media (max-width: 900px) {
      .panel, .span-6, .span-8, .span-12 { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="panel span-12">
      <p>{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <p>{{SUBTITLE}}</p>
    </header>
    <section class="grid">
      {{PANELS}}
    </section>
  </main>
</body>
</html>
